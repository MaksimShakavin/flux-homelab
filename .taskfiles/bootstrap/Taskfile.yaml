---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    cmds:
      - for: { var: NODE_IPS, split: ' ' }
        cmd: >-
          minijinja-cli --autoescape=none {{.TALOS_DIR}}/machineconfig.yaml.j2 {{.TALOS_DIR}}/talenv.yaml | op inject
          | talosctl machineconfig patch /dev/stdin
          --patch @{{.TALOS_DIR}}/nodes/k8s-control-$(( $(echo {{.ITEM}} | cut -d. -f4) - 50 )).yaml
          | talosctl --nodes {{.ITEM}} apply-config --insecure --file /dev/stdin
      - until talosctl --nodes 192.168.20.51 bootstrap; do sleep 10; done
      - until talosctl --nodes 192.168.20.51 kubeconfig {{.ROOT_DIR}} --force; do sleep 10; done
    vars:
      NODE_IPS: 192.168.20.51 192.168.20.52 192.168.20.53
    preconditions:
      - op account get
      - test -f {{.TALOS_DIR}}/machineconfig.yaml.j2
      - test -f {{.TALOS_DIR}}/talenv.yaml
      - which minijinja-cli op talosctl

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
