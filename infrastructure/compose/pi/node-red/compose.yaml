services:
  node-red-homekit:
    image: nrchkb/node-red-homekit:4.0.12@sha256:f222012048cf9824fb73efd96c77756992a8e48cad8ca0b4588ea8c2fbc2ffc7
    restart: unless-stopped
    # HomeKit (HAP/mDNS) needs the host network to be discoverable by the Home app.
    network_mode: host
    environment:
      TZ: Europe/Warsaw
      DEBUG: "NRCHKB*,CameraSource*"
      FLOWS: flows.json
    volumes:
      - "nodered-data:/data"

volumes:
  # Mount the NAS share directly in the container namespace — the host
  # /media/nas autofs is unreliable and doesn't propagate into containers.
  nodered-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.20.5,rw,nfsvers=4"
      device: ":/volume1/rpi/docker/Appdata/nodered"
