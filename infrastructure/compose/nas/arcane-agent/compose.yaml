services:
  arcane-agent:
    image: getarcaneapp/agent:v3.2.0
    restart: unless-stopped
    environment:
      ARCANE_AGENT: "true"
      ARCANE_AGENT_TRANSPORT: auto
      # Routed LB IP: the arcane.exelent.click envoy VIP (.20) isn't ARP-reachable from this subnet.
      ARCANE_MANAGER_API_URL: http://192.168.69.64:3552
      ARCANE_AGENT_TOKEN: ${ARCANE_AGENT_TOKEN:?ARCANE_AGENT_TOKEN is required}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "arcane-agent-data:/app/data"

volumes:
  arcane-agent-data:
