---
- name: Set up Synology containers (pre-cluster dependencies)
  hosts:
    - synology
  # Docker on DSM is root-owned, so container tasks need sudo.
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:
    garage_dir: /volume1/docker/garage
    compose_src: "{{ playbook_dir }}/../../compose/nas"
    # DSM keeps the docker CLI out of Ansible's PATH (/usr/bin:/bin:/usr/sbin:/sbin).
    docker_cli: /usr/local/bin/docker
    # DSM ships Python 3.8, but ansible-core needs 3.9+ on the target. Bootstrap a
    # self-contained standalone Python (no system deps) over raw SSH, use it for
    # this run, then remove it. https://github.com/astral-sh/python-build-standalone
    py_release: "20260901"
    py_version: "3.11.16"
    # /tmp is mounted noexec on DSM, so the interpreter lives on /volume1.
    py_dir: /volume1/docker/.ansible-python
    py_bin: /volume1/docker/.ansible-python/python/bin/python3

  tasks:
    # ansible_user can't come from a 1Password lookup in the inventory (that's
    # resolved at parse time). These tasks are delegate_to: localhost, so they
    # run before any SSH connection to the NAS and can set ansible_user first.
    - name: Get Synology admin username from 1Password
      onepassword.connect.field_info:
        token: "{{ sops.OP_CONNECT_TOKEN }}"
        hostname: "{{ sops.OP_CONNECT_HOST }}"
        item: synology
        field: username
        vault: homelab
      no_log: true
      delegate_to: localhost
      become: false
      register: synology_username_field

    - name: Set Synology admin user
      ansible.builtin.set_fact:
        ansible_user: "{{ synology_username_field.field.value }}"
      no_log: true

    - name: Get Synology sudo password from 1Password
      onepassword.connect.field_info:
        token: "{{ sops.OP_CONNECT_TOKEN }}"
        hostname: "{{ sops.OP_CONNECT_HOST }}"
        item: synology
        field: password
        vault: homelab
      no_log: true
      delegate_to: localhost
      become: false
      register: synology_password_field

    - name: Set SSH and become password
      ansible.builtin.set_fact:
        ansible_password: "{{ synology_password_field.field.value }}"
        ansible_become_password: "{{ synology_password_field.field.value }}"
      no_log: true

    - name: Get garage rpc_secret from 1Password
      onepassword.connect.field_info:
        token: "{{ sops.OP_CONNECT_TOKEN }}"
        hostname: "{{ sops.OP_CONNECT_HOST }}"
        item: garage
        field: rpc_secret
        vault: homelab
      no_log: true
      delegate_to: localhost
      become: false
      register: garage_rpc_secret_field

    - name: Get garage admin_token from 1Password
      onepassword.connect.field_info:
        token: "{{ sops.OP_CONNECT_TOKEN }}"
        hostname: "{{ sops.OP_CONNECT_HOST }}"
        item: garage
        field: admin_token
        vault: homelab
      no_log: true
      delegate_to: localhost
      become: false
      register: garage_admin_token_field

    - name: Set garage secret facts
      ansible.builtin.set_fact:
        garage_rpc_secret: "{{ garage_rpc_secret_field.field.value }}"
        garage_admin_token: "{{ garage_admin_token_field.field.value }}"
      no_log: true

    - name: Get arcane-agent enrollment token from 1Password
      onepassword.connect.field_info:
        token: "{{ sops.OP_CONNECT_TOKEN }}"
        hostname: "{{ sops.OP_CONNECT_HOST }}"
        item: arcane
        field: AGENT_TOKEN_NAS
        vault: homelab
      no_log: true
      delegate_to: localhost
      become: false
      register: arcane_agent_token_field

    - name: Set arcane-agent token fact
      ansible.builtin.set_fact:
        arcane_agent_token: "{{ arcane_agent_token_field.field.value }}"
      no_log: true

    # --- Bootstrap a target Python (raw = no target Python required) ---------
    - name: Bootstrap standalone Python for Ansible
      ansible.builtin.raw: |
        set -e
        # Already fully bootstrapped (interpreter + PyYAML present)? Nothing to do.
        if "{{ py_bin }}" -c "import yaml" 2>/dev/null; then exit 0; fi
        arch=$(uname -m)
        url="https://github.com/astral-sh/python-build-standalone/releases/download/{{ py_release }}/cpython-{{ py_version }}+{{ py_release }}-${arch}-unknown-linux-gnu-install_only.tar.gz"
        rm -rf "{{ py_dir }}"
        mkdir -p "{{ py_dir }}"
        curl -fsSL "$url" -o "{{ py_dir }}/python.tar.gz"
        tar -xzf "{{ py_dir }}/python.tar.gz" -C "{{ py_dir }}"
        rm -f "{{ py_dir }}/python.tar.gz"
        # docker_compose_v2 needs PyYAML; the standalone build ships stdlib only.
        "{{ py_bin }}" -m pip install --quiet PyYAML
        "{{ py_bin }}" --version
      changed_when: true

    - name: Use the bootstrapped Python for subsequent tasks
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ py_bin }}"

    # --- Garage --------------------------------------------------------------
    - name: Create garage data/meta directories
      ansible.builtin.file:
        path: "{{ garage_dir }}/{{ item }}"
        state: directory
      loop:
        - data
        - meta

    - name: Template garage.toml
      ansible.builtin.template:
        src: garage.toml.j2
        dest: "{{ garage_dir }}/garage.toml"
        mode: "0600"
      no_log: true

    - name: Deploy garage container project
      community.docker.docker_compose_v2:
        docker_cli: "{{ docker_cli }}"
        project_name: garage
        definition: "{{ lookup('ansible.builtin.file', compose_src + '/garage/compose.yaml') | from_yaml }}"
        state: present

    # --- Prometheus node-exporter -------------------------------------------
    - name: Deploy node-exporter container project
      community.docker.docker_compose_v2:
        docker_cli: "{{ docker_cli }}"
        project_name: node-exporter
        definition: "{{ lookup('ansible.builtin.file', compose_src + '/node-exporter/compose.yaml') | from_yaml }}"
        state: present

    # --- Arcane agent --------------------------------------------------------
    - name: Deploy arcane-agent container project
      community.docker.docker_compose_v2:
        docker_cli: "{{ docker_cli }}"
        project_name: arcane-agent
        definition: "{{ lookup('ansible.builtin.file', compose_src + '/arcane-agent/compose.yaml') | from_yaml }}"
        state: present
      environment:
        ARCANE_AGENT_TOKEN: "{{ arcane_agent_token }}"
      no_log: true

    # --- Tear down the bootstrapped Python -----------------------------------
    - name: Remove the bootstrapped Python
      ansible.builtin.raw: rm -rf "{{ py_dir }}"
      changed_when: true
