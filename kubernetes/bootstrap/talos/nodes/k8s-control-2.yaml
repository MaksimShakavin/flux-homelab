apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: k8s-control-2
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("bc:24:11:0c:fd:22", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.20.52/24
routes:
  - gateway: 192.168.20.1
