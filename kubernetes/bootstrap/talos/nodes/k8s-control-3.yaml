apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: k8s-control-3
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("bc:24:11:a8:19:33", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.20.53/24
routes:
  - gateway: 192.168.20.1
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.20.60
link: ethSel0
