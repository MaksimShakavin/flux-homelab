apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: k8s-control-1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("bc:24:11:b5:dd:1f", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.20.51/24
routes:
  - gateway: 192.168.20.1
