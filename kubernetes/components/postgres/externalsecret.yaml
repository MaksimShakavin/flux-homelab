---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-${APP}-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-${APP}-backup
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        AWS_REGION: garage
  data:
    # AWS creds are auto-published by Tofu into the shared garage-buckets item,
    # with bucket-prefixed field labels. All apps share the one cnpg key; barman
    # isolates them by serverName / destinationPath s3://cnpg/${APP}.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: garage-buckets
        property: cnpg_AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: garage-buckets
        property: cnpg_AWS_SECRET_ACCESS_KEY
