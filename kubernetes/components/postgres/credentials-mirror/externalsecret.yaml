---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-${APP}-app
spec:
  # Mirror the CNPG operator-generated app secret from the database namespace
  # into the app namespace, rewriting host/uri to the FQDN of the -rw service so
  # it resolves cross-namespace. CNPG's own secret carries a bare service name.
  secretStoreRef:
    kind: SecretStore
    name: postgres-${APP}
  refreshInterval: 1m
  target:
    name: postgres-${APP}-app
    template:
      engineVersion: v2
      data:
        host: postgres-${APP}-rw.database.svc.cluster.local
        port: "{{ .port }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
        dbname: "{{ .dbname }}"
        uri: "postgresql://{{ .username }}:{{ .password }}@{{ printf \"%s:%s\" \"postgres-${APP}-rw.database.svc.cluster.local\" .port }}/{{ .dbname }}"
        jdbc-uri: "jdbc:postgresql://postgres-${APP}-rw.database.svc.cluster.local:{{ .port }}/{{ .dbname }}?password={{ .password }}&user={{ .username }}"
  dataFrom:
    - extract:
        key: postgres-${APP}-app
