---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  data:
    # AWS creds are auto-published by Tofu into the shared garage-buckets item,
    # with bucket-prefixed field labels.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: garage-buckets
        property: kopiur_AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: garage-buckets
        property: kopiur_AWS_SECRET_ACCESS_KEY
    # KOPIA_PASSWORD stays in the hand-managed kopiur item.
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur
        property: KOPIA_PASSWORD
