---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-kritika-owner
spec:
  # Owner role creds for CNPG. initdb consumes username+password (no uri needed
  # here); the app-namespace copy carries the uri. Keep the 1Password owner
  # password stable: CNPG sets it once at initdb and does not re-sync it.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-kritika-owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-kritika-app
spec:
  # Application role creds for the DatabaseRole. CNPG reconciles the role
  # password from this secret, so it may rotate in 1Password if ever needed.
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-kritika-app
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .KRITIKA_POSTGRES_APP_PASSWORD }}"
  dataFrom:
    - extract:
        key: kritika
