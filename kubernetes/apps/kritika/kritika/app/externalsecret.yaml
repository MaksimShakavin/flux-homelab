---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kritika-secret
    template:
      data:
        KRITIKA_AUTH_ADMIN_PASSWORD: "{{ .KRITIKA_ADMIN_PASSWORD }}"
        KRITIKA_GITHUB_CLIENT_ID: "{{ .GITHUB_APP_CLIENT_ID }}"
        KRITIKA_GITHUB_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY }}"
        KRITIKA_GITHUB_WEBHOOK_SECRET: "{{ .GITHUB_WEBHOOK_SECRET }}"
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-owner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kritika-postgres-owner
    template:
      data:
        uri: "postgres://kritika:{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}@postgres-kritika-rw.database.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kritika-postgres-app
    template:
      data:
        uri: "postgres://kritika_app:{{ .KRITIKA_POSTGRES_APP_PASSWORD }}@postgres-kritika-rw.database.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kritika-s3-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  data:
    # AWS creds are auto-published by Tofu into the shared garage-buckets item,
    # with bucket-prefixed field labels (Phase 1).
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: garage-buckets
        property: kritika_AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: garage-buckets
        property: kritika_AWS_SECRET_ACCESS_KEY
