---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kguardian
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: kguardian
    gethomepage.dev/icon: mdi-shield-lock
    gethomepage.dev/description: eBPF network & seccomp policy generator
    gethomepage.dev/href: "https://kguardian.exelent.click"
spec:
  hostnames:
    - kguardian.exelent.click
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: kguardian-frontend
          port: 5173
