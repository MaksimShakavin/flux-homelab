[agent]
  interval = "30s"
  flush_interval = "30s"
  omit_hostname = true

# pohulanka (local) — sensor values
[[inputs.mqtt_consumer]]
  servers       = ["tcp://192.168.20.3:44444"]
  topics        = ["/devices/+/controls/+"]
  client_id     = "telegraf-pohulanka"
  username      = "${POHULANKA_MQTT_USER}"
  password      = "${POHULANKA_MQTT_PASSWORD}"
  qos           = 0
  data_format   = "value"
  data_type     = "float"
  name_override = "mqtt_data"
  [inputs.mqtt_consumer.tags]
    home = "pohulanka"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "/devices/+/controls/+"
    tags  = "/_/device/_/control"

# pohulanka (local) — device titles (consumed by processor, dropped)
[[inputs.mqtt_consumer]]
  servers       = ["tcp://192.168.20.3:44444"]
  topics        = ["/devices/+/meta"]
  client_id     = "telegraf-pohulanka-meta"
  username      = "${POHULANKA_MQTT_USER}"
  password      = "${POHULANKA_MQTT_PASSWORD}"
  qos           = 0
  data_format   = "value"
  data_type     = "string"
  name_override = "mqtt_meta"
  [inputs.mqtt_consumer.tags]
    home = "pohulanka"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "/devices/+/meta"
    tags  = "/_/device/_"

# pirs (remote, raw Wiren Board via pirs-vpn) — sensor values, anonymous
[[inputs.mqtt_consumer]]
  servers       = ["tcp://pirs-vpn.observability.svc.cluster.local:1883"]
  topics        = [
    "/devices/wb-msw-v3_40/controls/+", "/devices/wb-msw-v3_57/controls/+",
    "/devices/wb-msw-v3_59/controls/+", "/devices/wb-m1w2_152/controls/+",
    "/devices/wb-m1w2_118/controls/+",  "/devices/wb-m1w2_214/controls/+",
    "/devices/wb-m1w2_200/controls/+",  "/devices/wb-map6s_43/controls/+",
    "/devices/wb-mwac_51/controls/+",
  ]
  client_id     = "telegraf-pirs"
  qos           = 0
  data_format   = "value"
  data_type     = "float"
  name_override = "mqtt_data"
  [inputs.mqtt_consumer.tags]
    home = "pirs"
  [inputs.mqtt_consumer.tagdrop]
    control = ["Serial", "Buzzer", "Red LED", "Green LED"]
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "/devices/+/controls/+"
    tags  = "/_/device/_/control"

# pirs (remote) — device friendly names (plain string at meta/name, anonymous)
[[inputs.mqtt_consumer]]
  servers       = ["tcp://pirs-vpn.observability.svc.cluster.local:1883"]
  topics        = ["/devices/+/meta/name"]
  client_id     = "telegraf-pirs-meta"
  qos           = 0
  data_format   = "value"
  data_type     = "string"
  name_override = "mqtt_meta_raw"
  [inputs.mqtt_consumer.tags]
    home = "pirs"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "/devices/+/meta/name"
    tags  = "/_/device/_/_"

# cache device title -> stamp as `name` tag; drop meta metrics
[[processors.starlark]]
  source = '''
load("json.star", "json")
state = {}
def apply(metric):
    home = metric.tags.get("home", "")
    dev = metric.tags.get("device")
    if metric.name == "mqtt_meta":
        payload = metric.fields.get("value")
        if payload != None and dev != None:
            title = json.decode(payload).get("title", {}).get("en")
            if title != None:
                state[home + "/" + dev] = title
        return None
    if metric.name == "mqtt_meta_raw":
        payload = metric.fields.get("value")
        if payload != None and dev != None:
            state[home + "/" + dev] = payload
        return None
    if dev != None:
        name = state.get(home + "/" + dev)
        if name != None:
            metric.tags["name"] = name
    return metric
'''

[[outputs.influxdb]]
  urls                   = ["http://victoria-metrics-server.observability.svc.cluster.local:8428"]
  database               = "mqtt_data"
  skip_database_creation = true
