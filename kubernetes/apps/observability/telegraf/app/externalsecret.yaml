---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegraf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: telegraf-secret
  data:
    # spruthub-web has duplicate Node-RED field labels; extract fails on them, so select by property
    - secretKey: POHULANKA_MQTT_USER
      remoteRef:
        key: spruthub-web
        property: MQTT_USER
    - secretKey: POHULANKA_MQTT_PASSWORD
      remoteRef:
        key: spruthub-web
        property: MQTT_PASSWORD
