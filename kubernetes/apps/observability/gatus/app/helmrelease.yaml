---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: gatus
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "5"
      env:
        TZ: Europe/Warsaw
      envFrom:
        - secretRef:
            name: "{{ .Release.Name }}-secret"
    sidecar:
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: true
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/href: "https://gatus.exelent.click"
        gethomepage.dev/group: "Monitoring & Observability"
        gethomepage.dev/name: Gatus
        gethomepage.dev/icon: gatus.png
        gethomepage.dev/description: Status page
        gethomepage.dev/weight: "10"
        gethomepage.dev/widget.type: gatus
        gethomepage.dev/widget.url: http://gatus-gatus-sidecar.observability.svc.cluster.local:8080
        gethomepage.dev/pod-selector: app.kubernetes.io/name=gatus-sidecar
      hostnames:
        - "{{ .Release.Name }}.exelent.click"
        - status.exelent.click
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    config:
      existingConfigMap: "{{ .Release.Name }}-configmap"
      items:
        - key: config.yaml
          path: config.yaml
    persistence:
      enabled: true
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 5Gi
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
