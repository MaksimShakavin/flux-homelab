---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: robusta-holmes-extra
rules:
  - apiGroups:
      - cert-manager.io
      - acme.cert-manager.io
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
      - orders
      - challenges
    verbs: [get, list, watch]
  - apiGroups:
      - postgresql.cnpg.io
      - barmancloud.cnpg.io
    resources:
      - clusters
      - backups
      - scheduledbackups
      - poolers
      - databases
      - objectstores
    verbs: [get, list, watch]
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
      - volumesnapshotcontents
      - volumesnapshotclasses
    verbs: [get, list, watch]
  - apiGroups:
      - kopiur.home-operations.com
    resources:
      - snapshots
      - snapshotschedules
      - snapshotpolicies
      - restores
      - clusterrepositories
    verbs: [get, list, watch]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: robusta-holmes-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: robusta-holmes-extra
subjects:
  - kind: ServiceAccount
    name: robusta-holmes-service-account
    namespace: observability
