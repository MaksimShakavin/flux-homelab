---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arcane
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: arcane-secret
    template:
      engineVersion: v2
      data:
        ARCANE_ENCRYPTION_KEY: "{{ .ARCANE_ENCRYPTION_KEY }}"
        ARCANE_OIDC_ENABLED: "true"
        ARCANE_OIDC_PROVIDER_NAME: Authentik
        ARCANE_OIDC_ISSUER_URL: "https://sso.exelent.click/application/o/arcane/"
        ARCANE_OIDC_SCOPES: "openid email profile"
        ARCANE_OIDC_AUTO_REDIRECT_TO_PROVIDER: "false"
        ARCANE_OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        ARCANE_OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: arcane
