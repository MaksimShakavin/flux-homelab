---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    cleanPrometheusOperatorObjectNames: true
    prometheusOperator:
      livenessProbe:
        timeoutSeconds: 5
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 5
        failureThreshold: 5
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.exelent.click
          parentRefs:
            - name: envoy-internal
              namespace: network
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/href: "https://alertmanager.exelent.click"
            gethomepage.dev/pod-selector: app.kubernetes.io/name=alertmanager
            gethomepage.dev/icon: alertmanager.png
            gethomepage.dev/name: Alertmanager
            gethomepage.dev/group: "Monitoring & Observability"
            gethomepage.dev/description: Alert routing & silencing
            gethomepage.dev/weight: "60"
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.exelent.click
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-hostpath
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.exelent.click
          parentRefs:
            - name: envoy-internal
              namespace: network
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/href: "https://prometheus.exelent.click"
            gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
            gethomepage.dev/icon: prometheus.png
            gethomepage.dev/name: Prometheus
            gethomepage.dev/group: "Monitoring & Observability"
            gethomepage.dev/description: Metrics & alerting engine
            gethomepage.dev/weight: "50"
      prometheusSpec:
        externalUrl: https://prometheus.exelent.click
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 18GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 6000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-hostpath
              resources:
                requests:
                  storage: 20Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
    defaultRules:
      disabled:
        NodeDiskIOSaturation: true
    additionalPrometheusRulesMap:
      node-diskio-rules:
        groups:
          - name: node-diskio
            rules:
              - alert: NodeDiskIOSaturation
                annotations:
                  summary: Disk IO queue is critically high on {{ $labels.instance }} ({{ $labels.device }}).
                  description: >-
                    Disk IO queue (aqu-sq) on {{ $labels.device }} at {{ $labels.instance }} has held
                    above 100 (value {{ printf "%.1f" $value }}) for 15m, indicating severe saturation.
                expr: |-
                  rate(node_disk_io_time_weighted_seconds_total{job="node-exporter", device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m]) > 100
                for: 15m
                labels:
                  severity: warning
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
