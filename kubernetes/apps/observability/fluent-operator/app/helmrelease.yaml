---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: fluent-operator
  values:
    containerRuntime: containerd
    Kubernetes: true
    operator:
      enable: true
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
    fluentbit:
      enable: true
      logLevel: warning
      serviceMonitor:
        enable: true
      input:
        tail:
          # Reassemble container log lines that containerd split into partial
          # (logtag P) chunks; without this, long lines (e.g. base64 certs) arrive
          # fragmented and parse into garbage.
          multilineParser: cri
        systemd:
          enable: false
      filter:
        kubernetes:
          enable: true
          mergeLog: true
          # Drop the raw `log` once mergeLog parses a JSON line, so the logfmt
          # parser never runs on already-parsed JSON (which mangles it into
          # key=true tokens). Non-JSON lines fail the merge and keep `log`.
          keepLog: false
          labels: true
          annotations: false
        systemd:
          enable: false
    fluentd:
      enable: false
