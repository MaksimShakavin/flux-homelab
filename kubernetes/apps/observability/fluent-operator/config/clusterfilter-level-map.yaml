---
# Readable multi-line Lua for zz-level-map, mounted from this ConfigMap by the
# operator (must live in the operator's namespace = observability). Inline `code`
# can't be multi-line: the operator joins lines with "; " and LuaJIT rejects the
# stray ";" after a function/if header.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-level-map-lua
data:
  level_map.lua: |
    -- Derive `level` (+ clean `msg`) for the level-less formats reaching VictoriaLogs.
    -- Only recognised lines are touched; merged JSON has log==nil and is skipped.
    -- Return 1 = record modified, 0 = unchanged.
    local klog = { I = "info", W = "warning", E = "error", F = "fatal" }
    local zap = {
      debug = "debug", info = "info", warn = "warning", warning = "warning",
      error = "error", dpanic = "error", panic = "error", fatal = "fatal",
    }
    -- Rust tracing (e.g. kopiur): ISO ts + UPPERCASE level word.
    local tracing = {
      TRACE = "trace", DEBUG = "debug", INFO = "info",
      WARN = "warning", WARNING = "warning", ERROR = "error", FATAL = "fatal",
    }

    function set_level(tag, ts, record)
      local line = record["log"]
      if line == nil then return 0, ts, record end

      -- klog: "I0912 21:14:04.686 1 file.go:132] message"
      local sev = string.match(line, "^([IWEF])%d%d%d%d ")
      if sev ~= nil then
        record["level"] = klog[sev]
        local msg = string.match(line, "^[IWEF]%d%d%d%d .-%] (.*)$")
        if msg ~= nil then record["msg"] = msg end
        return 1, ts, record
      end

      -- zap: "<ISO ts>\t<level>\t<logger>\t<caller>\t<msg>\t..." (tab-delimited, lowercase)
      local lvl = string.match(line, "^%d%d%d%d%-%d%d%-%d%dT[^\t]*\t([a-z]+)\t")
      if lvl ~= nil and zap[lvl] ~= nil then
        record["level"] = zap[lvl]
        local n = 0
        for f in string.gmatch(line, "[^\t]+") do
          n = n + 1
          if n == 5 then record["msg"] = f break end
        end
        return 1, ts, record
      end

      -- Rust tracing: "<ISO ts>  LEVEL message"
      local tl = string.match(line, "^%d%d%d%d%-%d%d%-%d%dT%S+%s+(%u+)%s")
      if tl ~= nil and tracing[tl] ~= nil then
        record["level"] = tracing[tl]
        local tm = string.match(line, "^%d%d%d%d%-%d%d%-%d%dT%S+%s+%u+%s+(.*)$")
        if tm ~= nil then record["msg"] = tm end
        return 1, ts, record
      end

      return 0, ts, record
    end
---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  # zz- prefix: runs after logfmt-parse so it's authoritative over stray matches.
  name: zz-level-map
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  filters:
    - lua:
        call: set_level
        protectedMode: true
        script:
          name: fluent-bit-level-map-lua
          key: level_map.lua
