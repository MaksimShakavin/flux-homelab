---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  # zz- prefix: runs after logfmt-parse so it's authoritative over stray matches.
  name: zz-level-map
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  filters:
    # Derive level (+ clean msg) for the level-less formats reaching VictoriaLogs.
    # Multi-line inline Lua is fine: the operator joins statement lines with "; " and
    # control-flow lines (function/if/for/else/elseif/end/--[[) with a space. Rules to keep
    # the join valid: single-line tables, no blank lines, block comments only (a "--" line
    # would comment out the rest after flattening), then/do on their opener line.
    - lua:
        call: set_level
        protectedMode: true
        code: |
          local klog = { I = "info", W = "warning", E = "error", F = "fatal" }
          local zap = { debug = "debug", info = "info", warn = "warning", warning = "warning", error = "error", dpanic = "error", panic = "error", fatal = "fatal" }
          local fb = { trace = "trace", debug = "debug", info = "info", warn = "warning", error = "error" }
          function set_level(tag, ts, record)
            --[[ merged JSON has log==nil; only recognised plaintext lines are touched ]]
            local line = record["log"]
            if line == nil then return 0, ts, record end
            --[[ klog: severity letter + date, bracketed caller, then message ]]
            local sev = string.match(line, "^([IWEF])%d%d%d%d ")
            if sev ~= nil then
              record["level"] = klog[sev]
              local msg = string.match(line, "^[IWEF]%d%d%d%d .-%] (.*)$")
              if msg ~= nil then record["msg"] = msg end
              return 1, ts, record
            end
            --[[ zap: ISO ts, tab, lowercase level, tab; msg is the 5th tab field ]]
            local lvl = string.match(line, "^%d%d%d%d%-%d%d%-%d%dT[^\t]*\t([a-z]+)\t")
            if lvl ~= nil and zap[lvl] ~= nil then
              record["level"] = zap[lvl]
              local n = 0
              for f in string.gmatch(line, "[^\t]+") do
                n = n + 1
                if n == 5 then record["msg"] = f break end
              end
              return 1, ts, record
            end
            --[[ fluent-bit self: [date time.ms] [ level] [component] message ]]
            local fl = string.match(line, "^%[%d%d%d%d/%d%d/%d%d [%d:%.]+%] %[%s*(%a+)%]")
            if fl ~= nil and fb[fl] ~= nil then
              record["level"] = fb[fl]
              local fm = string.match(line, "^%[[^%]]*%] %[%s*%a+%] %[[^%]]*%] (.*)$")
              if fm == nil then fm = string.match(line, "^%[[^%]]*%] %[%s*%a+%] (.*)$") end
              if fm ~= nil then record["msg"] = fm end
              return 1, ts, record
            end
            return 0, ts, record
          end
