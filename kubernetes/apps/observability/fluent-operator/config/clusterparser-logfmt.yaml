---
# level + quoted msg from logfmt lines (e.g. longhorn-manager). Named groups only
# (not the native logfmt parser) so bare words can't explode VictoriaLogs columns.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterParser
metadata:
  name: logfmt-fields
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  regex:
    # level=<word> msg="<escape-aware>"
    regex: 'level=(?<level>[a-zA-Z]+)\s+msg="(?<msg>(?:[^"\\]|\\.)*)"'
---
# fallback: level= with no adjacent quoted msg still gets a level (msg stays in log).
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterParser
metadata:
  name: logfmt-level
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  regex:
    regex: 'level=(?<level>[a-zA-Z]+)'
