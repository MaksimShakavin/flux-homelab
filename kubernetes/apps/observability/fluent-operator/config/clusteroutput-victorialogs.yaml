---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterOutput
metadata:
  name: victorialogs
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  http:
    host: victoria-logs-server.observability.svc.cluster.local
    port: 9428
    # _msg_field is a priority list, first present wins. fields.message = tracing-JSON
    # message (brrpolice); event = authentik request path; log = raw plaintext fallback.
    uri: /insert/jsonline?_stream_fields=kubernetes.pod_name,kubernetes.namespace_name,kubernetes.container_name&_msg_field=msg,message,log_message,fields.message,event,log&_time_field=date
    format: json_lines
    jsonDateFormat: iso8601
    compress: gzip
