---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  # Name sorts after the chart's "containerd"/"kubernetes" filters so logfmt
  # runs last (verify order in the rendered ClusterFluentBitConfig).
  name: logfmt-parse
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  filters:
    - parser:
        keyName: log
        # First-match wins: logfmt-fields pulls level+msg from logrus lines; the
        # logfmt-level regex is the fallback that still yields a level when a line
        # has no quoted msg. Neither creates arbitrary fields, so plaintext logs
        # (no level=) pass through untouched instead of exploding into columns.
        parser: logfmt-fields,logfmt-level
        reserveData: true
        preserveKey: true
