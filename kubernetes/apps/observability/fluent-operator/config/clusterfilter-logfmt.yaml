---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  # name sorts after the chart's "kubernetes" filter, so this runs after JSON merge.
  name: logfmt-parse
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  filters:
    - parser:
        keyName: log
        # first-match wins: logfmt-fields pulls level+msg, logfmt-level is level-only
        # fallback. Bounded regex (no arbitrary fields) so plaintext can't explode columns.
        parser: logfmt-fields,logfmt-level
        reserveData: true
        preserveKey: true
