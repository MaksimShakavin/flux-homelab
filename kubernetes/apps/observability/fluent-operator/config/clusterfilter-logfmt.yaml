---
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  # Name sorts after the chart's "containerd"/"kubernetes" filters so logfmt
  # runs last (verify order in the rendered ClusterFluentBitConfig).
  name: logfmt-parse
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  filters:
    - parser:
        keyName: log
        # First-match wins: logfmt extracts full fields on clean lines; the
        # logfmt-level regex is the fallback that still yields a level when
        # logfmt can't parse the line.
        parser: logfmt,logfmt-level
        reserveData: true
        preserveKey: true
