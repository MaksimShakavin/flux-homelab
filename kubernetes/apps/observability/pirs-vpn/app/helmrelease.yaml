---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pirs-vpn
spec:
  chartRef:
    kind: OCIRepository
    name: pirs-vpn
  interval: 1h
  values:
    controllers:
      gateway:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            restartPolicy: Always
            env:
              TZ: "Europe/Warsaw"
              PUID: "0"
              PGID: "0"
              VPN_SERVICE_PROVIDER: custom
              VPN_TYPE: openvpn
              OPENVPN_CUSTOM_CONFIG: /gluetun/custom/client.conf
              OPENVPN_USER:
                valueFrom:
                  secretKeyRef:
                    name: pirs-vpn-secret
                    key: OPENVPN_USER
              OPENVPN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pirs-vpn-secret
                    key: OPENVPN_PASSWORD
              FIREWALL_INPUT_PORTS: "1883,9100,9999"
              FIREWALL_OUTBOUND_SUBNETS: "10.69.0.0/16,10.96.0.0/16"
              HEALTH_SERVER_ADDRESS: ":9999"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                add: ["NET_ADMIN"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
              limits:
                squat.ai/tun: 1
                memory: 128Mi
        containers:
          socat-mqtt:
            image:
              repository: docker.io/alpine/socat
              tag: 1.8.1.3@sha256:71131702f671a88b3808a70b7330f9679cd9b9933adcafadc191508edfe55bba
            args: ["-d", "TCP-LISTEN:1883,fork,reuseaddr", "TCP:192.168.50.27:1883"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 32Mi
          socat-pi-node:
            image:
              repository: docker.io/alpine/socat
              tag: 1.8.1.3@sha256:71131702f671a88b3808a70b7330f9679cd9b9933adcafadc191508edfe55bba
            args: ["-d", "TCP-LISTEN:9100,fork,reuseaddr", "TCP:192.168.50.141:9100"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 32Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      pirs-vpn:
        controller: gateway
        forceRename: pirs-vpn
        ports:
          mqtt:
            port: 1883
          pi-node:
            port: 9100
    persistence:
      vpn-config:
        type: secret
        name: pirs-vpn-secret
        advancedMounts:
          gateway:
            gluetun:
              - path: /gluetun/custom/client.conf
                subPath: client.conf
                readOnly: true
      gluetun-tmp:
        type: emptyDir
        medium: Memory
        advancedMounts:
          gateway:
            gluetun:
              - path: /tmp/gluetun
