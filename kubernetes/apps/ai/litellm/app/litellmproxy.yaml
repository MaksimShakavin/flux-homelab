---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.109.0@sha256:26aecfb02fb17ac6590f0549478561f9fbb3f69314317320b2e32a21beed4006
  replicas: 1
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  generalSettings:
    health_check_endpoint: /v1/health
    disable_env_credential_login: true
    store_model_in_db: true
    store_prompts_in_spend_logs: true
    maximum_spend_logs_retention_period: 30d
    maximum_spend_logs_retention_interval: 1d
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
    num_retries: 3
    timeout: 600
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    cache: false
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: dragonfly-litellm.database.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: REDIS_PASSWORD
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    - name: CLIPROXY_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: CLIPROXY_API_KEY
    - name: OPENROUTER_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: OPENROUTER_API_KEY
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: postgres-litellm-app
          key: uri
    - name: PROXY_BASE_URL
      value: https://litellm.exelent.click
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_ID
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: GENERIC_CLIENT_SECRET
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://sso.exelent.click/application/o/authorize/
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://sso.exelent.click/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://sso.exelent.click/application/o/userinfo/
    - name: GENERIC_SCOPE
      value: openid email profile
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
