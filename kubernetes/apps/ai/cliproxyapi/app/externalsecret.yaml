---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi
    template:
      engineVersion: v2
      data:
        config.yaml: |
          config-version: 8
          server:
            port: 8317
          management:
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - "{{ .API_KEY }}"
          oauth:
            auth-dir: /data/auths
          routing:
            strategy: fill-first
  dataFrom:
    - extract:
        key: cliproxyapi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-seed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi-seed
    template:
      engineVersion: v2
      data:
        codex.json: "{{ .CODEX_AUTH }}"
  dataFrom:
    - extract:
        key: cliproxyapi
