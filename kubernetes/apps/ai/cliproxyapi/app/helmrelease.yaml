---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxyapi
spec:
  chartRef:
    kind: OCIRepository
    name: cliproxyapi
  interval: 1h
  values:
    controllers:
      cliproxyapi:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          seed:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                mkdir -p /data/auths
                if ls /data/auths/*.json >/dev/null 2>&1; then
                  echo "auths already present; keeping self-refreshed copy"
                  exit 0
                fi
                for f in /seed/*.json; do
                  [ -f "$f" ] || continue
                  cp "$f" /data/auths/
                  chmod 600 "/data/auths/$(basename "$f")"
                  echo "seeded $(basename "$f")"
                done
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
        containers:
          app:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.48@sha256:c198886a86b57f49cb2508a68b6170e23b2d509c648934af5d5dd827cf6faa16
            command:
              - /CLIProxyAPI/CLIProxyAPI
            args:
              - --config
              - /config/config.yaml
              - --local-model
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8317
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 8317
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      config:
        type: secret
        name: cliproxyapi
        globalMounts:
          - path: /config
            readOnly: true
      seed:
        type: secret
        name: cliproxyapi-seed
        advancedMounts:
          cliproxyapi:
            seed:
              - path: /seed
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
