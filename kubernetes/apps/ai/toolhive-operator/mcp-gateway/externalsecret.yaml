---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mcp-gateway-token
    template:
      engineVersion: v2
      data:
        local-claude: "{{ .MCP_GATEWAY_TOKEN }}"
  dataFrom:
    - extract:
        key: mcp-gateway
