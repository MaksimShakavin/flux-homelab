---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-gateway
  apiKeyAuth:
    extractFrom:
      - headers:
          - X-API-Key
    credentialRefs:
      - name: mcp-gateway-token
