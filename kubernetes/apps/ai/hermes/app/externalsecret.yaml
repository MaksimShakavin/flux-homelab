---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-secret
    template:
      engineVersion: v2
      data:
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        TELEGRAM_ALLOWED_USERS: "{{ .TELEGRAM_ALLOWED_USERS }}"
        # Dashboard OIDC (Authentik) — public PKCE client, no secret
        HERMES_DASHBOARD_OIDC_ISSUER: "https://sso.exelent.click/application/o/hermes/"
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email"
  dataFrom:
    - extract:
        key: hermes
