---
_config_version: 47

timezone: Europe/Warsaw

providers:
  litellm:
    name: LiteLLM
    base_url: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    api_mode: chat_completions
    discover_models: true

model:
  provider: litellm
  default: subscription-gpt-sol

dashboard:
  public_url: https://hermes.exelent.click

browser:
  backend: "off"
  cloud_provider: steel
  steel:
    base_url: http://steel-browser.ai.svc.cluster.local:3000

mcp_servers:
  securo:
    url: http://mcp-securo-remote-proxy.default.svc.cluster.local:8080/mcp
  homebox:
    url: http://mcp-homebox-mcp-proxy.default.svc.cluster.local:8080/mcp
  vikunja:
    url: http://mcp-vikunja-mcp-proxy.default.svc.cluster.local:8080/mcp

gateway:
  platforms:
    telegram:
      extra:
        disable_topic_auto_rename: true

plugins:
  enabled:
    - browser-steel
  disabled: []
