---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: hermes
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: cliproxyapi
      namespace: ai
    - name: litellm
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/hermes/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
  postBuild:
    substitute:
      APP: hermes
      APP_NAMESPACE: ai
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
