---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: steel-browser
spec:
  chartRef:
    kind: OCIRepository
    name: steel-browser
  interval: 1h
  values:
    controllers:
      steel-browser:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/steel-dev/steel-browser-api
              tag: latest@sha256:6a7644925c588441eaf185db77b0911aebe8c81334ac8c01c988f65060fdd776
            env:
              # IP, not DNS: clients open this as a CDP socket and Chromium's
              # host guard rejects a hostname Host. Must match the pinned clusterIP.
              DOMAIN: 10.96.20.56:3000
              DEFAULT_TIMEZONE: Europe/Warsaw
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probe
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 75m
                memory: 1Gi
              limits:
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: steel-browser
        # pinned so DOMAIN can hardcode it
        clusterIP: 10.96.20.56
        ports:
          http:
            port: 3000
    persistence:
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      ca-policy:
        type: configMap
        name: steel-browser-ca-policy
        advancedMounts:
          steel-browser:
            app:
              - path: /etc/chromium/policies/managed/01_russian_ca.json
                subPath: 01_russian_ca.json
                readOnly: true
