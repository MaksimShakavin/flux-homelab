---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-gateway-secret
spec:
  dependsOn:
    - name: onepassword
      namespace: external-secrets
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  path: ./kubernetes/apps/ai/mcp-gateway/secret
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  targetNamespace: ai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-gateway
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: mcp-gateway
  dependsOn:
    - name: toolhive-operator
      namespace: ai
    - name: mcp-gateway-dragonfly
      namespace: ai
    - name: mcp-gateway-secret
      namespace: ai
    - name: onepassword
      namespace: external-secrets
  healthCheckExprs:
    - apiVersion: toolhive.stacklok.dev/v1beta1
      kind: VirtualMCPServer
      failed: status.phase != 'Ready'
      current: status.phase == 'Ready'
  path: ./kubernetes/apps/ai/mcp-gateway/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: mcp-gateway-auth
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  targetNamespace: ai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-gateway-dragonfly
spec:
  components:
    - ../../../../../components/dragonfly
    - ../../../../../components/dragonfly/authentication
  dependsOn:
    - name: dragonfly
      namespace: database
    - name: onepassword
      namespace: external-secrets
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'Ready'
      current: status.phase == 'Ready'
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/ai/mcp-gateway/db/dragonfly
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
  postBuild:
    substitute:
      APP: mcp-gateway
      APP_NAMESPACE: ai
      DRAGONFLY_PASSWORD_SECRET: dragonfly-mcp-gateway-auth
