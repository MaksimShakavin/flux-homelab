---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: default
spec:
  groupRef:
    name: default
  authServerConfig:
    issuer: https://mcp.exelent.click
    insecureAllowHTTP: false
    signingKeySecretRefs:
      - name: mcp-gateway-auth
        key: AS_SIGNING_KEY
    hmacSecretRefs:
      - name: mcp-gateway-auth
        key: AS_HMAC_SECRET
    upstreamProviders:
      - name: authentik
        type: oidc
        oidcConfig:
          issuerUrl: https://sso.exelent.click/application/o/mcp-gateway/
          # In-cluster DNS resolves sso.exelent.click to the internal gateway
          # (private IP); permit the discovery client to reach it.
          allowPrivateIPs: true
          clientId: ${OIDC_CLIENT_ID}
          clientSecretRef:
            name: mcp-gateway-auth
            key: OIDC_CLIENT_SECRET
          scopes:
            - openid
            - profile
            - email
            - offline_access
          redirectUri: https://mcp.exelent.click/oauth/callback
    baselineClientScopes:
      - openid
      - offline_access
    storage:
      type: redis
      maxDCRClients: 50
      redis:
        addr: dragonfly-mcp-gateway.database.svc.cluster.local:6379
        aclUserConfig:
          passwordSecretRef:
            name: mcp-gateway-auth
            key: DRAGONFLY_PASSWORD
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: mcp-gateway
      audience: https://mcp.exelent.click/mcp
      resourceUrl: https://mcp.exelent.click/mcp
  outgoingAuth:
    source: discovered
