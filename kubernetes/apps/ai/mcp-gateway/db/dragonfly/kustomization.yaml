---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./dragonfly-auth.externalsecret.yaml
patches:
  # vMCP pod is labelled by VirtualMCPServer name, not ${APP}; match toolhive-name
  - target:
      kind: NetworkPolicy
      name: dragonfly-.*-client
    patch: |
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels
        value:
          toolhive-name: default
  # vMCP auth-server Lua touches hash-tagged keys Dragonfly rejects as undeclared
  - target:
      kind: Dragonfly
    patch: |
      - op: add
        path: /spec/args/-
        value: --default_lua_flags=allow-undeclared-keys
