---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubesearch-mcp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: kubesearch-mcp
  dependsOn:
    - name: mcp-gateway
      namespace: ai
    - name: onepassword
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/ai/kubesearch-mcp/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
