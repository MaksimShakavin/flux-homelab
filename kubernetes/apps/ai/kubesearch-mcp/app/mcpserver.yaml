---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubesearch-mcp
spec:
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
  transport: streamable-http
  mcpPort: 3000
  proxyPort: 8080
  groupRef:
    name: default
  env:
    - name: MCP_TRANSPORT
      value: streamable-http
    - name: MCP_HTTP_PORT
      value: "3000"
    - name: KUBESEARCH_ENABLE_CLONE
      value: "true"
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
