---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dawarich-secret
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ .SECRET_KEY_BASE }}"
        REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly-dawarich.database.svc.cluster.local:6379/0"
        # OIDC (Authentik); presence of issuer+client enables it. Defaults already
        # match intent: auto-register on, local login on, self-registration off.
        OIDC_ISSUER: "https://sso.exelent.click/application/o/dawarich/"
        OIDC_REDIRECT_URI: "https://dawarich.exelent.click/users/auth/openid_connect/callback"
        OIDC_PROVIDER_NAME: Authentik
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: dawarich
