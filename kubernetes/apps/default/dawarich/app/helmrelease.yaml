---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dawarich
spec:
  chartRef:
    kind: OCIRepository
    name: dawarich
  interval: 1h
  values:
    controllers:
      dawarich:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: mirror.gcr.io/freikin/dawarich
              tag: 1.23.0@sha256:c9c6a9c04fa2ad11c438fc0b0ea3b7d95fc7e6d8c7a3cfa98bf1fc5aef2dbfd4
            # Image ENTRYPOINT is bare `bundle exec` with no CMD; the web service's
            # entrypoint script runs migrations then `exec bundle exec "$@"`.
            command: ["web-entrypoint.sh"]
            args: ["bin/rails", "server", "-p", "3000", "-b", "0.0.0.0"]
            env:
              RAILS_ENV: production
              SELF_HOSTED: "true"
              APPLICATION_PROTOCOL: https
              APPLICATION_HOSTS: dawarich.exelent.click,dawarich-api.exelent.click
              TIME_ZONE: Europe/Warsaw
              # Embedded Sidekiq runs jobs in the web process (no worker container);
              # WEB_CONCURRENCY=0 keeps Puma single-process so jobs don't double-run.
              SIDEKIQ_EMBEDDED: "true"
              WEB_CONCURRENCY: "0"
              # Ruby's Dir.tmpdir refuses the world-writable tmp emptyDir; point it
              # at the init-created subdir owned by 1000 (not world-writable).
              TMPDIR: /var/app/tmp/ruby
              DATABASE_HOST:
                valueFrom:
                  secretKeyRef:
                    name: postgres-dawarich-app
                    key: host
              DATABASE_PORT:
                valueFrom:
                  secretKeyRef:
                    name: postgres-dawarich-app
                    key: port
              DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: postgres-dawarich-app
                    key: dbname
              DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: postgres-dawarich-app
                    key: username
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-dawarich-app
                    key: password
            envFrom:
              - secretRef:
                  name: dawarich-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: &port 3000
                    # force_ssl (APPLICATION_PROTOCOL=https) 301s plain-HTTP probes.
                    httpHeaders: &probeHeaders
                      - name: X-Forwarded-Proto
                        value: https
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                    httpHeaders: *probeHeaders
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  # First-boot migrations need headroom.
                  failureThreshold: 180
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
        initContainers:
          # Ruby's Dir.tmpdir refuses the 0777 tmp emptyDir; pre-create a 0700
          # subdir owned by 1000 so imports can resolve a temp directory.
          init-tmp:
            image: *image
            command: ["sh", "-c", "mkdir -p /var/app/tmp/ruby && chmod 700 /var/app/tmp/ruby"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: dawarich
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.exelent.click"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: dawarich
          gethomepage.dev/href: "https://dawarich.exelent.click"
          gethomepage.dev/group: "Home Apps"
          gethomepage.dev/name: Dawarich
          gethomepage.dev/icon: dawarich.png
          gethomepage.dev/description: Location history
          gethomepage.dev/weight: "70"
      # Mobile ingest only: a dedicated public host exposing just /api/v1; the
      # gateway 404s every other path since no rule matches it. Kept separate
      # from the internal UI host so the UI has no public record to shadow it.
      external:
        hostnames:
          - "{{ .Release.Name }}-api.exelent.click"
        parentRefs:
          - name: envoy-external
            namespace: network
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            path: /api/v1/health
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/v1
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/app/storage
          - path: /var/app/tmp/imports/watched
            subPath: imports/watched
      # Entrypoint re-syncs baked assets from public_dist into public every boot;
      # under readOnlyRootFS that target needs a writable, ephemeral mount.
      public:
        type: emptyDir
        globalMounts:
          - path: /var/app/public
      tmp:
        type: emptyDir
        globalMounts:
          - path: /var/app/tmp
