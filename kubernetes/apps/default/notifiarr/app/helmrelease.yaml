---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notifiarr
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: notifiarr
  interval: 1h
  values:
    annotations:
      reloader.stakater.com/auto: "true"
    defaultPodOptions:
      hostname: notifiarr-kube
    controllers:
      notifiarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: golift/notifiarr
              tag: 0.9@sha256:2b0a8784d8a43177cbc5a19110e7eb066d9321572c3352eda79c0a89898c7735
            env:
              PUID: 1000
              PGID: 1000
              UMASK: 002
              TZ: "Europe/Warsaw"
            envFrom:
              - secretRef:
                  name: notifiarr-secret
    configMaps:
      # Pins the host id; without it Notifiarr mints a new UUID each restart and
      # the website flags the previous client as offline ("has not sent an update").
      machine-id:
        data:
          machine-id: |
            4045cfc150884974ac8a3f06e5859b4c
    persistence:
      machine-id:
        type: configMap
        identifier: machine-id
        globalMounts:
          - path: /etc/machine-id
            subPath: machine-id
    service:
      app:
        ports:
          http:
            port: 5454
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.exelent.click"
        parentRefs:
          - name: envoy-internal
            namespace: network
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://notifiarr.exelent.click"
          gethomepage.dev/icon: notifiarr.png
          gethomepage.dev/name: Notifiarr
          gethomepage.dev/group: "Monitoring & Observability"
          gethomepage.dev/description: Arr notifications management
          gethomepage.dev/weight: "90"
