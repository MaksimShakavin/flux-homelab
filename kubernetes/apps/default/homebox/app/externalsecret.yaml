---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homebox-secret
    template:
      engineVersion: v2
      data:
        # Rotating invalidates every existing Homebox API key.
        HBOX_AUTH_API_KEY_PEPPER: "{{ .HBOX_AUTH_API_KEY_PEPPER }}"
        # A matching-email local account must exist before each user's first OIDC
        # login, else OIDC spawns an isolated new group instead of migrating.
        HBOX_OIDC_ENABLED: "true"
        HBOX_OIDC_ISSUER_URL: https://sso.exelent.click/application/o/homebox/
        HBOX_OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        HBOX_OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        HBOX_OIDC_ALLOWED_GROUPS: users
        HBOX_OIDC_AUTO_REDIRECT: "true"
  dataFrom:
    - extract:
        key: homebox
