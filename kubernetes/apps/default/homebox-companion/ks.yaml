---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homebox-companion
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: homebox
      namespace: default
    - name: litellm
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/default/homebox-companion/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
  postBuild:
    substitute:
      APP: homebox-companion
      APP_NAMESPACE: default
      KOPIUR_CAPACITY: 1Gi
