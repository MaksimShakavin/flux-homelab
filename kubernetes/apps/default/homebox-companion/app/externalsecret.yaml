---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-companion
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homebox-companion-secret
    template:
      engineVersion: v2
      data:
        # Homebox API key for the dedicated integration account (see runbook).
        HBC_HOMEBOX_API_KEY: "{{ .HBC_HOMEBOX_API_KEY }}"
  dataFrom:
    - extract:
        key: homebox
