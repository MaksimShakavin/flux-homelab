---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homebox-companion
spec:
  chartRef:
    kind: OCIRepository
    name: homebox-companion
  interval: 1h
  values:
    controllers:
      homebox-companion:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/duelion/homebox-companion
              repository: ghcr.io/duelion/homebox-companion
              tag: 3.2.2@sha256:5bc324f5db2bc96f8b516b10ee5b1477044e8e721e39f6c2627911e31f09827a
            env:
              TZ: Europe/Warsaw
              HBC_HOMEBOX_URL: http://homebox.default.svc.cluster.local:7745
              HBC_LINK_BASE_URL: https://homebox.exelent.click
              HBC_LLM_API_BASE: http://litellm.ai.svc.cluster.local:4000/v1
              # LiteLLM alias (openai/ prefix selects the OpenAI-compatible provider).
              # terra = gpt-6.1-terra, tuned for visual reasoning (photo -> item
              # detection); luna is a cheaper fallback the key also authorizes.
              HBC_LLM_MODEL: openai/subscription-gpt-terra
              # Required: custom LiteLLM aliases aren't in the capability registry,
              # so the vision precheck rejects them without this.
              HBC_LLM_ALLOW_UNSAFE_MODELS: "true"
              HBC_DISABLE_UPDATE_CHECK: "true"
              HBC_HOMEBOX_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: homebox-companion-secret
                    key: HBC_HOMEBOX_API_KEY
              HBC_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: homebox-companion-litellm-key
                    key: LITELLM_API_KEY
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: &port 8000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # Image runs as its own non-root user (appuser, uid/gid 1000); not overridden.
        # fsGroup is set solely so that user can write the Longhorn /app/data volume.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: homebox-companion
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.exelent.click"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://homebox-companion.exelent.click"
          gethomepage.dev/group: "Home Apps"
          gethomepage.dev/name: Homebox Companion
          gethomepage.dev/icon: homebox.png
          gethomepage.dev/description: AI item capture for Homebox
          gethomepage.dev/weight: "80"
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
