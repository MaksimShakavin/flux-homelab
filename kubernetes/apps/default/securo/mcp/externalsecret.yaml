---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: securo-mcp-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: securo-mcp-token
    template:
      engineVersion: v2
      data:
        token: "{{ .AGENTS_MCP_BEARER_TOKEN }}"
  dataFrom:
    - extract:
        key: securo
