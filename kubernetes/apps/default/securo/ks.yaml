---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: securo
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/credentials-mirror
  dependsOn:
    - name: securo-postgres
      namespace: default
    - name: securo-dragonfly
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/securo/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
  postBuild:
    substitute:
      APP: securo
      APP_NAMESPACE: default
      KOPIUR_CAPACITY: 5Gi
