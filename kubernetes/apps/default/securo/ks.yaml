---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: securo
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/credentials-mirror
  dependsOn:
    - name: securo-postgres
      namespace: default
    - name: securo-dragonfly
      namespace: default
  interval: 1h
  path: ./kubernetes/apps/default/securo/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
  postBuild:
    substitute:
      APP: securo
      APP_NAMESPACE: default
      KOPIUR_CAPACITY: 5Gi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: securo-postgres
spec:
  components:
    - ../../../../../components/postgres
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: onepassword
      namespace: external-secrets
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/securo/db/postgres
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
  postBuild:
    substitute:
      APP: securo
      APP_NAMESPACE: default
      POSTGRES_IMAGE: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: securo-dragonfly
spec:
  components:
    - ../../../../../components/dragonfly
    - ../../../../../components/dragonfly/authentication
  dependsOn:
    - name: dragonfly
      namespace: database
    - name: onepassword
      namespace: external-secrets
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'Ready'
      current: status.phase == 'Ready'
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/securo/db/dragonfly
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
  postBuild:
    substitute:
      APP: securo
      APP_NAMESPACE: default
      DRAGONFLY_PASSWORD_SECRET: dragonfly-securo-auth
