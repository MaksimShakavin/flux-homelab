---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: securo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: securo-secret
    template:
      engineVersion: v2
      data:
        # Core
        SECRET_KEY: "{{ .SECRET_KEY }}"
        # OIDC (Authentik) — local auth stays on so we keep a fallback login
        OIDC_ENABLED: "true"
        LOCAL_AUTH_ENABLED: "true"
        OIDC_PROVIDER_NAME: Authentik
        OIDC_DISCOVERY_URL: "https://sso.exelent.click/application/o/securo/.well-known/openid-configuration"
        OIDC_REDIRECT_URI: "https://securo.exelent.click/api/auth/oidc/callback"
        OIDC_SCOPES: "openid email profile"
        OIDC_AUTO_REGISTER: "true"
        OIDC_REQUIRE_VERIFIED_EMAIL: "false"
        OIDC_EXISTING_USER_LINK_MODE: "email"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        # Bank sync — Enable Banking
        ENABLE_BANKING_APP_ID: "{{ .ENABLE_BANKING_APP_ID }}"
        ENABLE_BANKING_PRIVATE_KEY: "{{ .ENABLE_BANKING_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: securo
