---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karakeep
spec:
  chartRef:
    kind: OCIRepository
    name: karakeep
  interval: 1h
  values:
    controllers:
      karakeep:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/karakeep-app/karakeep
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.35.0
            env:
              TZ: "Europe/Warsaw"
              DATA_DIR: /data
              MEILI_ADDR: http://127.0.0.1:7700
              # ws:// + API port 3000: connectOverCDP skips the /json/version probe
              # (Steel strips the port there) and hits Steel's CDP ws endpoint directly
              BROWSER_WEB_URL: ws://steel-browser.ai.svc.cluster.local:3000
              BROWSER_CONNECT_ONDEMAND: "true"
              WORKERS_PORT: &metricsport 3001
              # 0.0.0.0 so the ServiceMonitor can reach it
              WORKERS_HOST: 0.0.0.0
              CRAWLER_FULL_PAGE_ARCHIVE: "true"
              # accept root-owned /run under non-root
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              INFERENCE_TEXT_MODEL: subscription-gpt-luna
              INFERENCE_IMAGE_MODEL: subscription-gpt-terra
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
              INFERENCE_CONTEXT_LENGTH: "8000"
              INFERENCE_JOB_TIMEOUT_SEC: "120"
              EMBEDDING_TEXT_MODEL: text-embedding-3-small
              # not auto-on once OPENAI_BASE_URL is overridden
              EMBEDDING_ENABLE_AUTO_INDEXING: "true"
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-litellm-key
                    key: LITELLM_API_KEY
            envFrom:
              - secretRef:
                  name: karakeep-secret
            probes:
              # generous liveness grace for first-boot SQLite migrations
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &httpport 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *httpport
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          meilisearch:
            image:
              # renovate: datasource=docker depName=getmeili/meilisearch
              repository: getmeili/meilisearch
              tag: v1.55.0
            env:
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: "true"
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: MEILI_MASTER_KEY
            probes:
              liveness: &meiliprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &meiliport 7700
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *meiliprobe
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [ 10000 ]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: karakeep
        ports:
          http:
            port: *httpport
          metrics:
            port: *metricsport
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.exelent.click"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *httpport
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://karakeep.exelent.click"
          gethomepage.dev/group: "Home Apps"
          gethomepage.dev/name: Karakeep
          gethomepage.dev/icon: karakeep.svg
          gethomepage.dev/description: Bookmark everything
          gethomepage.dev/weight: "65"
          gethomepage.dev/widget.type: karakeep
          gethomepage.dev/widget.url: http://karakeep.default:3000
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_KARAKEEP_TOKEN}}` }}"
          gethomepage.dev/widget.fields: '["bookmarks","favorites","archived","tags"]'
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          karakeep:
            app:
              - path: /data
      meilisearch:
        existingClaim: karakeep-meilisearch
        advancedMounts:
          karakeep:
            meilisearch:
              - path: /meili_data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # s6-overlay needs a writable /run
      run:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /run
