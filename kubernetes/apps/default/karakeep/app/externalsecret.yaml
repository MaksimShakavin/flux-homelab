---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: karakeep-secret
    template:
      engineVersion: v2
      data:
        NEXTAUTH_URL: "https://karakeep.exelent.click"
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        OAUTH_PROVIDER_NAME: authentik
        OAUTH_WELLKNOWN_URL: "https://sso.exelent.click/application/o/karakeep/.well-known/openid-configuration"
        OAUTH_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        DISABLE_PASSWORD_AUTH: "true"
        # flip to "true" after the first account is provisioned
        DISABLE_SIGNUPS: "false"
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
        PROMETHEUS_AUTH_TOKEN: "{{ .PROMETHEUS_AUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: karakeep
