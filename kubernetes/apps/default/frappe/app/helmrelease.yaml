---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frappe
  annotations:
    # scripts below use shell ${SITE_NAME}/${DB_ROOT_PASSWORD}; keep Flux envsubst off them
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  chartRef:
    kind: OCIRepository
    name: frappe
  interval: 1h
  values:
    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-site:
            image: &image
              # renovate: datasource=docker depName=ghcr.io/frappe/lms
              repository: ghcr.io/frappe/lms
              tag: v16.1.1
            command:
              - bash
              - -c
              - |
                set -e
                cd /home/frappe/frappe-bench
                echo "waiting for mariadb..."
                until (echo > /dev/tcp/frappe-mariadb.database.svc.cluster.local/3306) 2>/dev/null; do sleep 3; done
                ls -1 apps > sites/apps.txt
                bench set-config -g  db_host frappe-mariadb.database.svc.cluster.local
                bench set-config -gp db_port 3306
                bench set-config -g  redis_cache    redis://dragonfly-frappe.database.svc.cluster.local:6379
                bench set-config -g  redis_queue    redis://dragonfly-frappe.database.svc.cluster.local:6379
                bench set-config -g  redis_socketio redis://dragonfly-frappe.database.svc.cluster.local:6379
                bench set-config -gp socketio_port 9000
                if [ -f "sites/${SITE_NAME}/site_config.json" ]; then
                  echo "site ${SITE_NAME} already exists, skipping new-site"
                  exit 0
                fi
                bench new-site "${SITE_NAME}" \
                  --db-root-username root \
                  --db-root-password "${DB_ROOT_PASSWORD}" \
                  --mariadb-user-host-login-scope=% \
                  --admin-password "${ADMIN_PASSWORD}" \
                  --install-app lms
            env:
              SITE_NAME: &sitename "{{ .Release.Name }}.exelent.click"
            envFrom: &initsecret
              - secretRef:
                  name: frappe-secret
        containers:
          app:
            image: *image
            env:
              GUNICORN_WORKERS: "2"
            probes:
              liveness: &tcp8000
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *tcp8000
              startup:
                enabled: false
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          wait-for-site: &waitforsite
            image: *image
            command:
              - bash
              - -c
              - |
                until [ -f "/home/frappe/frappe-bench/sites/${SITE_NAME}/site_config.json" ]; do
                  echo "waiting for site init..."; sleep 5
                done
            env:
              SITE_NAME: *sitename
        containers:
          app:
            image: *image
            args: ["nginx-entrypoint.sh"]
            env:
              BACKEND: frappe-backend:8000
              SOCKETIO: frappe-websocket:9000
              FRAPPE_SITE_NAME_HEADER: *sitename
              CLIENT_MAX_BODY_SIZE: 500m
            probes:
              liveness: &httpping
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/method/ping
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *httpping
              startup:
                enabled: false
            securityContext: *sc
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
      websocket:
        initContainers:
          wait-for-site: *waitforsite
        containers:
          app:
            image: *image
            args: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
            probes:
              liveness: &tcp9000
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9000
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *tcp9000
              startup:
                enabled: false
            securityContext: *sc
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
      background:
        initContainers:
          wait-for-site: *waitforsite
        containers:
          scheduler:
            image: *image
            args: ["bench", "schedule"]
            probes: &noprobe
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }
            securityContext: *sc
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
          worker:
            image: *image
            args: ["bench", "worker", "--queue", "short,default,long"]
            probes: *noprobe
            securityContext: *sc
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8000
      frontend:
        controller: frontend
        ports:
          http:
            port: 8080
      websocket:
        controller: websocket
        ports:
          websocket:
            port: 9000
    route:
      app:
        hostnames:
          - *sitename
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: frontend
                port: 8080
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://frappe.exelent.click"
          gethomepage.dev/group: "Home Apps"
          gethomepage.dev/name: Frappe LMS
          gethomepage.dev/icon: frappe-lending.svg
          gethomepage.dev/description: Learning management
          gethomepage.dev/weight: "95"
    persistence:
      # course uploads land under sites/<site>/{public,private}/files — on the NAS by requirement
      sites:
        type: nfs
        server: "nas.exelent.click"
        path: "/volume1/kubernetes/frappe"
        globalMounts:
          - path: /home/frappe/frappe-bench/sites
