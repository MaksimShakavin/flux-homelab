---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frappe
  annotations:
    # scripts below use shell ${SITE_NAME}/${DB_ROOT_PASSWORD}; keep Flux envsubst off them
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  chartRef:
    kind: OCIRepository
    name: frappe
  interval: 1h
  values:
    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-site:
            image: &image
              # renovate: datasource=docker depName=ghcr.io/maksimshakavin/frappe-lms
              repository: ghcr.io/maksimshakavin/frappe-lms
              tag: 2026.11.15
            command:
              - bash
              - -c
              - |
                set -e
                cd /home/frappe/frappe-bench
                echo "waiting for mariadb..."
                until (echo > /dev/tcp/frappe-mariadb.database.svc.cluster.local/3306) 2>/dev/null; do sleep 3; done
                ls -1 apps > sites/apps.txt
                # fresh NFS sites/ volume hides the image's baked config; set-config reads it before writing
                [ -f sites/common_site_config.json ] || echo '{}' > sites/common_site_config.json
                bench set-config -g  db_host frappe-mariadb.database.svc.cluster.local
                bench set-config -gp db_port 3306
                bench set-config -g  redis_cache    redis://frappe-valkey.database.svc.cluster.local:6379
                bench set-config -g  redis_queue    redis://frappe-valkey.database.svc.cluster.local:6379
                bench set-config -g  redis_socketio redis://frappe-valkey.database.svc.cluster.local:6379
                bench set-config -gp socketio_port 9000
                if [ -d "sites/${SITE_NAME}" ]; then
                  # the dir (not just site_config.json) is what blocks new-site: a crashed
                  # bootstrap can leave the dir with no/stale config. Probe the DB; act on what we find.
                  if apps=$(bench --site "${SITE_NAME}" list-apps 2>/dev/null); then
                    installed=$(echo "${apps}" | awk '{print $1}')
                    if echo "${installed}" | grep -qx lms; then
                      echo "site ${SITE_NAME} healthy with lms, nothing to do"
                      exit 0
                    fi
                    # site DB is usable but lacks lms (created against an image without the app).
                    # install onto the existing site rather than rebuild; payments is lms' required_app.
                    echo "site ${SITE_NAME} present but missing lms; installing payments + lms onto it"
                    echo "${installed}" | grep -qx payments || bench --site "${SITE_NAME}" install-app payments
                    bench --site "${SITE_NAME}" install-app lms
                    exit 0
                  fi
                  echo "site ${SITE_NAME} unusable (incomplete bootstrap); moving aside for a clean rebuild"
                  # drop-site archives the dir to container-local archived/sites/ -> EXDEV on NFS.
                  # same-device rename within sites/ instead: atomic, tolerates open handles from
                  # other pods; strip the marker so frappe stops treating the moved copy as a site.
                  broken="sites/.broken-$(date +%s)"
                  mv "sites/${SITE_NAME}" "${broken}"
                  rm -f "${broken}/site_config.json" 2>/dev/null || true
                fi
                bench new-site "${SITE_NAME}" \
                  --db-root-username root \
                  --db-root-password "${DB_ROOT_PASSWORD}" \
                  --mariadb-user-host-login-scope=% \
                  --admin-password "${ADMIN_PASSWORD}" \
                  --install-app payments \
                  --install-app lms
            env:
              SITE_NAME: &sitename "{{ .Release.Name }}.exelent.click"
            envFrom: &initsecret
              - secretRef:
                  name: frappe-secret
        containers:
          app:
            image: *image
            env:
              GUNICORN_WORKERS: "2"
            probes:
              liveness: &tcp8000
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *tcp8000
              startup:
                enabled: false
            securityContext: &sc
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
            # nginx-entrypoint writes /etc/nginx/conf.d + /run; those dirs are group-root
            # writable (arbitrary-uid image), so the non-root uid needs supplementary gid 0
            supplementalGroups: [0]
        initContainers:
          wait-for-site: &waitforsite
            image: *image
            command:
              - bash
              - -c
              - |
                until [ -f "/home/frappe/frappe-bench/sites/${SITE_NAME}/site_config.json" ]; do
                  echo "waiting for site init..."; sleep 5
                done
            env:
              SITE_NAME: *sitename
        containers:
          app:
            image: *image
            args: ["nginx-entrypoint.sh"]
            env:
              BACKEND: frappe-backend:8000
              SOCKETIO: frappe-websocket:9000
              FRAPPE_SITE_NAME_HEADER: *sitename
              CLIENT_MAX_BODY_SIZE: 500m
            probes:
              liveness: &httpping
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/method/ping
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *httpping
              startup:
                enabled: false
            securityContext: *sc
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
      websocket:
        initContainers:
          wait-for-site: *waitforsite
        containers:
          app:
            image: *image
            args: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
            probes:
              liveness: &tcp9000
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9000
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *tcp9000
              startup:
                enabled: false
            securityContext: *sc
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
      background:
        initContainers:
          wait-for-site: *waitforsite
        containers:
          scheduler:
            image: *image
            args: ["bench", "schedule"]
            probes: &noprobe
              liveness: { enabled: false }
              readiness: { enabled: false }
              startup: { enabled: false }
            securityContext: *sc
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
          worker:
            image: *image
            args: ["bench", "worker", "--queue", "short,default,long"]
            probes: *noprobe
            securityContext: *sc
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8000
      frontend:
        controller: frontend
        ports:
          http:
            port: 8080
      websocket:
        controller: websocket
        ports:
          websocket:
            port: 9000
    route:
      app:
        hostnames:
          - *sitename
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: frontend
                port: 8080
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://frappe.exelent.click"
          gethomepage.dev/group: "Home Apps"
          gethomepage.dev/name: Frappe LMS
          gethomepage.dev/icon: frappe-lending.svg
          gethomepage.dev/description: Learning management
          gethomepage.dev/weight: "95"
    persistence:
      # course uploads land under sites/<site>/{public,private}/files — on the NAS by requirement
      sites:
        type: nfs
        server: "nas.exelent.click"
        path: "/volume1/kubernetes/frappe"
        globalMounts:
          - path: /home/frappe/frappe-bench/sites
