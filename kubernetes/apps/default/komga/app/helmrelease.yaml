---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: komga
spec:
  chartRef:
    kind: OCIRepository
    name: komga
  interval: 1h
  values:
    controllers:
      komga:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: gotson/komga
              tag: "1.27.0@sha256:341f1e7dbd48a42f4df7d0af40f7a6644d7db0b2ed6ea8cbc8c0ccaa71e48b66"
            env:
              TZ: "Europe/Warsaw"
              SERVER_PORT: &port 80
              KOMGA_CONFIGDIR: /config
              KOMGA_OAUTH2ACCOUNTCREATION: "true"
              KOMGA_OIDC_EMAIL_VERIFICATION: "false"
            envFrom:
              - secretRef:
                  name: komga-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 15m
                memory: 768Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: [ "{{ .Release.Name }}.exelent.click" ]
        parentRefs:
          - name: envoy-external
            namespace: network
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://komga.exelent.click"
          gethomepage.dev/icon: komga.svg
          gethomepage.dev/name: komga
          gethomepage.dev/group: "Home Apps"
          gethomepage.dev/description: "Comics, mangas, BDs, magazines and eBooks"
          gethomepage.dev/weight: "50"
          gethomepage.dev/widget.type: komga
          gethomepage.dev/widget.url: http://komga.default:80
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_KOMGA_API_KEY}}`}}"
          gethomepage.dev/widget.version: "2"
    persistence:
      server:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      application-config:
        type: secret
        name: komga-secret
        defaultMode: 0400
        globalMounts:
          - subPath: application.yml
            path: /config/application.yml
      saves:
        type: nfs
        server: "nas.exelent.click"
        path: "/volume1/kubernetes/torrents/magazines"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
