---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbit-unregistered-handler
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: qbit-unregistered-handler-secret
    template:
      engineVersion: v2
      data:
        config.yaml: |
          commands:
            # Dry run. Don't delete anything
            dry: false
            # Blocklist tracker-deleted (unregistered) torrents and get radarr/sonarr to redownload
            handle_unregistered: true

          qbittorrent:
            host: "qbittorrent.default.svc.cluster.local:8080"
            user: {{ .qbittorrent_username }}
            password: {{ .qbittorrent_password }}
            verify_ssl: false

          handle_unregistered:
            categories:
              - tv
              - movies
            season_search: false

          radarr:
            url: "http://radarr.default.svc.cluster.local"
            api_key: {{ .radarr_api_key }}
          sonarr:
            url: "http://sonarr.default.svc.cluster.local"
            api_key: {{ .sonarr_api_key }}
  data:
    - secretKey: radarr_api_key
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: sonarr_api_key
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
  dataFrom:
    - extract:
        key: qbittorrent
      rewrite:
        - regexp:
            source: "(.*)"
            target: "qbittorrent_$1"
