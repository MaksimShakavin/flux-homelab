---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            restartPolicy: Always
            env:
              TZ: "Europe/Warsaw"
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              WIREGUARD_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRIVATE_KEY
              SERVER_COUNTRIES: Russian Federation
              PORT_FORWARD_ONLY: "on"
              VPN_PORT_FORWARDING: "on"
              HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
              HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
              FIREWALL_INPUT_PORTS: "8080,9999"
              FIREWALL_OUTBOUND_SUBNETS: "10.69.0.0/16,10.96.0.0/16"
              HEALTH_SERVER_ADDRESS: ":9999"
              VERSION_INFORMATION: "off"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: false
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                add: [ "NET_ADMIN" ]
                drop: [ "ALL" ]
            resources:
              requests:
                cpu: 25m
              limits:
                squat.ai/tun: 1
                memory: 256Mi
          init-categories:
            image:
              repository: docker.io/library/alpine
              tag: 3.24.2
            command:
              - "sh"
              - "-c"
              - |
                mkdir -p /config/qBittorrent/ &&
                echo '{"movies": {"save_path": "/data/torrents/movies"}, "tv": {"save_path": "/data/torrents/tv"}}' > /config/qBittorrent/categories.json
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
            env:
              TZ: "Europe/Warsaw"
              QBT_WEBUI_PORT: &port 8080
              QBT_TORRENTING_PORT: 58462
              QBT_Preferences__Downloads__SavePath: /data/torrents
              QBT_Preferences__Downloads__TorrentExportDir: /data/torrents/.torrents
              QBT_Preferences__Downloads__FinishedTorrentExportDir: /data/torrents/.torrents/completed
              QBT_Preferences__WebUI__Password_PBKDF2: "@ByteArray(iXranQkCEwRqp96g0yKHHA==:2ujiTbO+e12jHqzAJccPqjrBcVmRhaTSrrMi27VRiv2rbWk50twuRcHBCc8jsX/J/oZ8JQnBzHFjNzZ2bvpZkQ==)"
              QBT_Preferences__WebUI__LocalHostAuth: false
              QBT_Preferences__WebUI__UseUPNP: false
              QBT_Preferences__WebUI__CSRFProtection: false
              QBT_Preferences__WebUI__ClickjackingProtection: false
              QBT_Preferences__WebUI__AuthSubnetWhitelistEnabled: true
              QBT_Preferences__WebUI__AuthSubnetWhitelist: |-
                10.69.0.0/16, 192.168.10.0/24, 192.168.20.0/24
              QBT_BitTorrent__Session__AlternativeGlobalDLSpeedLimit: 20000
              QBT_BitTorrent__Session__AlternativeGlobalUPSpeedLimit: 0
              QBT_BitTorrent__Session__GlobalUPSpeedLimit: 0
              QBT_BitTorrent__Session__GlobalDLSpeedLimit: 2500
              QBT_BitTorrent__Session__UseAlternativeGlobalSpeedLimit: false
              QBT_BitTorrent__Session__BandwidthSchedulerEnabled: true
              QBT_BitTorrent__Session__DisableAutoTMMByDefault: false
              QBT_BitTorrent__Session__TempPathEnabled: false
              QBT_BitTorrent__Session__DisableAutoTMMTriggers__CategorySavePathChanged: false
              QBT_BitTorrent__Session__DisableAutoTMMTriggers__DefaultSavePathChanged: false
              QBT_BitTorrent__Scheduler__days: true
              QBT_BitTorrent__Scheduler__start_time: '@Variant(\0\0\0\xf\0\0\0\0)'
              QBT_BitTorrent__Scheduler__end_time: '@Variant(\0\0\0\xf\x1\xb7t\0)'
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 10Gi
          port-watchdog:
            image:
              repository: docker.io/alpine/curl
              tag: 8.22.0@sha256:741b2d162e65956e3c694985a9b4c7f6a0714c8d6551bc68d9341d8474bf1ccf
            command: [ "/bin/sh", "/scripts/port-watchdog.sh" ]
            env:
              TZ: "Europe/Warsaw"
              GLUETUN_CONTROL_SERVER: http://localhost:8000
              GLUETUN_CONTROL_SERVER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: GLUETUN_CONTROL_SERVER_API_KEY
              QBITTORRENT_HOST: localhost
              QBITTORRENT_WEBUI_PORT: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      dnsPolicy: None
      dnsConfig:
        nameservers: [ "127.0.0.1" ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.exelent.click"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      downloads:
        type: nfs
        server: nas.exelent.click
        path: /volume1/kubernetes
        globalMounts:
          - path: /data
      gluetun-tmp:
        type: emptyDir
        medium: Memory
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /tmp/gluetun
      gluetun-auth:
        type: secret
        name: gluetun-secret
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /gluetun/auth/config.toml
                subPath: config.toml
                readOnly: true
      scripts:
        type: configMap
        name: qbittorrent-port-watchdog
        defaultMode: 0555
        advancedMounts:
          qbittorrent:
            port-watchdog:
              - path: /scripts/port-watchdog.sh
                subPath: port-watchdog.sh
                readOnly: true
