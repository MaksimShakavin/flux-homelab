---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: valheim-secret
    template:
      engineVersion: v2
      data:
        PASSWORD: "{{ .valheim_password }}"
  dataFrom:
    - extract:
        key: valheim
      rewrite:
        - regexp:
            source: "(.*)"
            target: "valheim_$1"
