---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
spec:
  chartRef:
    kind: OCIRepository
    name: vikunja
  interval: 1h
  values:
    controllers:
      vikunja:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/go-vikunja/vikunja
              tag: 2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
            env:
              TZ: Europe/Warsaw
              VIKUNJA_SERVICE_PUBLICURL: https://vikunja.exelent.click/
              VIKUNJA_SERVICE_TIMEZONE: Europe/Warsaw
              VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
              VIKUNJA_FILES_BASEPATH: /files
              VIKUNJA_KEYVALUE_TYPE: memory
              VIKUNJA_DATABASE_TYPE: postgres
              VIKUNJA_DATABASE_HOST: postgres-vikunja-rw.database.svc.cluster.local:5432
              VIKUNJA_DATABASE_DATABASE: vikunja
              VIKUNJA_DATABASE_SSLMODE: require
              VIKUNJA_AUTH_LOCAL_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: vikunja-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/info
                    port: 3456
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
            resources:
              requests:
                cpu: 15m
                memory: 128M
              limits:
                memory: 512M
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 3456
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.exelent.click"
        parentRefs:
          - name: envoy-external
            namespace: network
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /api/v1/info
          gethomepage.dev/enabled: "true"
          gethomepage.dev/href: "https://vikunja.exelent.click"
          gethomepage.dev/icon: vikunja.png
          gethomepage.dev/name: Vikunja
          gethomepage.dev/group: "Home Apps"
          gethomepage.dev/description: Task management
          gethomepage.dev/weight: "85"
    persistence:
      files:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /files
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
