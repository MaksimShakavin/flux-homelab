---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vikunja-secret
    template:
      engineVersion: v2
      data:
        # Whole config rendered here so all OIDC + DB settings stay in the ExternalSecret (repo convention).
        config.yml: |
          service:
            publicurl: https://vikunja.exelent.click/
            jwtsecret: "{{ .SERVICE_SECRET }}"
            timezone: Europe/Warsaw
            enableregistration: false
          database:
            type: postgres
            host: postgres-vikunja-rw.database.svc.cluster.local:5432
            user: "{{ .username }}"
            password: "{{ .password }}"
            database: "{{ .dbname }}"
            sslmode: require
          files:
            basepath: /files
          keyvalue:
            type: memory
          auth:
            local:
              enabled: true
            openid:
              enabled: true
              redirecturl: https://vikunja.exelent.click/auth/openid/
              providers:
                - name: Authentik
                  authurl: https://sso.exelent.click/application/o/vikunja/
                  clientid: "{{ .OIDC_CLIENT_ID }}"
                  clientsecret: "{{ .OIDC_CLIENT_SECRET }}"
                  scope: openid profile email
  dataFrom:
    # CNPG extract LAST so its DB password wins the `password` key — the
    # password-category 1P item injects an empty top-level `password` that
    # would otherwise clobber it (ESO merges dataFrom last-wins).
    - extract:
        key: vikunja
    - extract:
        key: postgres-vikunja-app
      sourceRef:
        storeRef:
          kind: SecretStore
          name: postgres-vikunja
