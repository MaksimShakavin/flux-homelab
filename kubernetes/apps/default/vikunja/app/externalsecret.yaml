---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: vikunja-secret
    template:
      engineVersion: v2
      data:
        VIKUNJA_SERVICE_SECRET: "{{ .SERVICE_SECRET }}"
        VIKUNJA_DATABASE_USER: "{{ .username }}"
        VIKUNJA_DATABASE_PASSWORD: "{{ .password }}"
        VIKUNJA_AUTH_OPENID_ENABLED: "true"
        VIKUNJA_AUTH_OPENID_REDIRECTURL: https://vikunja.exelent.click/auth/openid/
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME: Authentik
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL: https://sso.exelent.click/application/o/vikunja/
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID: "{{ .OIDC_CLIENT_ID }}"
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET: "{{ .OIDC_CLIENT_SECRET }}"
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_SCOPE: openid profile email
  dataFrom:
    - extract:
        key: vikunja
    - extract:
        key: postgres-vikunja-app
      sourceRef:
        storeRef:
          kind: SecretStore
          name: postgres-vikunja
