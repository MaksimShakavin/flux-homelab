---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: playit
spec:
  endpoints:
    - dnsName: "play.exelent.click"
      recordType: A
      targets: [ '209.25.141.16' ]
      # https://github.com/kubernetes-sigs/external-dns/issues/2418#issuecomment-987587518
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: 'false'
