---
# csi-grpc-proxy has no logging config and logs two lines per gRPC call (kubelet
# NodeGetCapabilities/NodeGetVolumeStats polling) — level-less, high-volume noise.
# Drop ONLY those two routine request shapes (after the Go date prefix) so real output
# (errors, panics, upstream failures) still reaches VictoriaLogs.
# Cluster-scoped but lives with the app; shared label wires it into the central Fluent Bit.
# zz- prefix: must sort after the chart's "kubernetes" filter to read container_name.
# Return -1 = drop the record.
apiVersion: fluentbit.fluent.io/v1alpha2
kind: ClusterFilter
metadata:
  name: zz-csi-proxy-drop-noise
  labels:
    fluentbit.fluent.io/enabled: "true"
spec:
  match: kube.*
  filters:
    - lua:
        call: drop_csi_proxy_noise
        protectedMode: true
        code: |
          function drop_csi_proxy_noise(tag, ts, record)
            local k = record["kubernetes"]
            if k == nil or k["container_name"] ~= "csi-proxy" then return 0, ts, record end
            local line = record["log"]
            if line == nil then return 0, ts, record end
            --[[ lines carry a Go date prefix ("2026/09/13 18:03:18 "); strip it, then drop only the two routine gRPC request shapes so errors survive ]]
            local rest = string.match(line, "^%d%d%d%d/%d%d/%d%d %d%d:%d%d:%d%d (.*)$") or line
            if string.match(rest, "^request %(") or string.match(rest, "^request headers ") then return -1, ts, record end
            return 0, ts, record
          end
